name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and test on Linux
        if: runner.os == 'Linux'
        run: sh build.sh
      - name: Build and test on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: ./build.ps1
      - name: Render desktop fixture
        if: runner.os == 'Linux'
        run: xvfb-run -a java -jar build/forge.jar --render build/workbench.png
      - name: Create complete demo workspace
        run: python fixtures/create_demo.py demo
      - name: Verify distributable
        run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: forge-${{ runner.os }}
          path: |
            build/forge-*.zip
            build/SHA256SUMS.txt
